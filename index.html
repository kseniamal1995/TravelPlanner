<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Планер маршрутов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700;8..60,800&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/index.css">
<!-- Telegram Mini App SDK. Вне Telegram window.Telegram.WebApp отсутствует — адаптер (src/services/telegram.js) тогда no-op. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov">
  <div class="modal">
    <button class="ovclose" id="ovClose" onclick="closeOv()" aria-label="Закрыть">✕</button>
    <h3 id="ovTitle"></h3>
    <div id="ovBody"></div>
    <div class="row">
      <button class="btn" id="ovCancel" onclick="closeOv()">Отмена</button>
      <button class="btn acc" id="ovSave">Сохранить</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
